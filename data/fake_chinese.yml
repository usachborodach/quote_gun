- Пририсовать змее ноги. 画蛇添足. huà shé tiān zú. Переусердствовать, испортить дело лишним.
- Позавтракать в Кировской. 画龙点睛. huà lóng diǎn jīng. Сжечь десяток литров дефицитного бензина чтобы поесть солянки.
- Играть на лютне перед буйволом. 对牛弹琴. duì niú tán qín. Метать бисер перед свиньями; напрасно тратить слова.
