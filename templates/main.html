<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>quote_gun</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        /* === Глобальные стили (как в quotes.html) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #121212;
            padding: 20px;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 2rem 1.5rem;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Сетка категорий */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .category-item {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 1.2rem 1rem;
            text-align: center;
            transition: background 0.2s, transform 0.15s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .category-item:hover {
            background: #333333;
            transform: translateY(-2px);
            border-color: #444;
        }

        .category-item a {
            color: #e0e0e0;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            display: block;
            width: 100%;
            height: 100%;
        }

        .category-item a:active {
            color: #bb86fc; /* акцент при клике */
        }

        /* Если категорий нет */
        .empty {
            color: #aaa;
            text-align: center;
            padding: 2rem 0;
            font-size: 1.2rem;
        }

        /* Адаптив */
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 1.5rem 1rem;
            }
            h1 {
                font-size: 1.6rem;
                margin-bottom: 1.2rem;
            }
            .category-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .category-item {
                padding: 1rem 0.8rem;
            }
            .category-item a {
                font-size: 1rem;
            }
        }

        @media (max-width: 420px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Лёгкий отступ для favicon – опционально */
        .favicon-margin {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 quote_gun</h1>

        {% if categories %}
            <div class="category-grid">
                {% for cat in categories %}
                    <div class="category-item">
                        <a href="/{{ cat }}">{{ cat }}</a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">Нет доступных категорий</div>
        {% endif %}

    </div>
</body>
</html>
